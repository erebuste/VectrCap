name: Windows headless checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # HEADLESS CI ONLY: synthetic files/databases, fake credentials/OS adapters,
  # private fixture HTTPS and pure UI/state tests. Ignored host tests stay ignored.
  headless-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_AUTO_INSTALL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # rust-toolchain.toml pins the compiler; every cargo call below uses it.
      - name: Install the pinned Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content -Raw rust-toolchain.toml) -notmatch 'channel\s*=\s*"([0-9.]+)"') { throw 'Missing exact toolchain pin' }
          rustup toolchain install $Matches[1] --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain provisioning failed' }
          rustc --version
      - name: Fetch locked Windows dependencies explicitly
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Formatter
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --offline -- -D warnings
      - name: All-target tests (no ignored interactive tests)
        run: cargo test --all-targets --offline
      - name: Build and package unsigned x64 release with locked notices
        run: ./scripts/build-release.ps1
