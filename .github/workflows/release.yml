name: Release

# Push a tag like v0.2.0 (matching Cargo.toml's version) to publish a GitHub Release.
# The in-app updater reads releases/latest and needs both VectrCap.exe and VectrCap.exe.sha256.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTUP_AUTO_INSTALL: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tag must match the Cargo.toml version
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content -Raw Cargo.toml) -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw 'No package version' }
          if ("v$($Matches[1])" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $($Matches[1])" }
      # rust-toolchain.toml pins the compiler; every cargo call below uses it.
      - name: Install the pinned Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Content -Raw rust-toolchain.toml) -notmatch 'channel\s*=\s*"([0-9.]+)"') { throw 'Missing exact toolchain pin' }
          rustup toolchain install $Matches[1] --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain provisioning failed' }
          rustc --version
      - name: Fetch locked Windows dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Tests
        run: cargo test --all-targets --offline
      - name: Build package
        run: ./scripts/build-release.ps1
      - name: Release assets
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'target/packages/VectrCap-x64'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$package/VectrCap.exe" dist/
          $hash = (Get-FileHash dist/VectrCap.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii dist/VectrCap.exe.sha256 "$hash  VectrCap.exe"
          Compress-Archive -Path "$package/*" -DestinationPath 'dist/VectrCap-${{ github.ref_name }}-x64.zip'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # PowerShell does not expand wildcards for native commands; list the files.
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem dist).FullName --title 'VectrCap ${{ github.ref_name }}' --generate-notes
