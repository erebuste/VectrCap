[package]
name = "vectrcap"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Windows tray capture and Vectr upload utility"
license = "UNLICENSED"
publish = false

# Native shell; capture, file ingress and History UI remain separate slices.
[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
gif = "=0.14.2"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
fontdue = { version = "=0.9.3", default-features = false, features = ["std"] }
webpx = { version = "=0.4.1", default-features = false, features = ["std", "encode"] }
libwebp-sys = { version = "=0.14.4", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
bytes = "1.11"
httpdate = "1.0.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
zeroize = "1.9.1"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts", "clipboard"] }
tray-icon = { version = "=0.26.1", default-features = false }

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["net", "io-util", "test-util", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# Already in the tree via dirs/tempfile. Handle-based file operations: directory-relative
# NtCreateFile opens, rename/delete/identity by handle, final-path checks, free space.
[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Performance", "Win32_System_Threading", "Win32_Security"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Security_Authorization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
