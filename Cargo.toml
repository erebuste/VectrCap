[package]
name = "vectrcap"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Windows tray capture and Vectr upload utility"
license = "UNLICENSED"
publish = false

# Task 1 dependencies only. GUI, tray, capture, media, and network crates are
# added by the tasks that use them (see docs/verification/foundation-report.md).
[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }

# Already in the tree via dirs/tempfile. Handle-based file operations: directory-relative
# NtCreateFile opens, rename/delete/identity by handle, final-path checks, free space.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
