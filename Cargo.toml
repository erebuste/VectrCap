[package]
name = "vectrcap"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Windows tray capture and Vectr upload utility"
license = "UNLICENSED"
publish = false

# Foundation and Task 2 only; GUI, tray, capture and media belong to later tasks.
[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
bytes = "1.11"
httpdate = "1.0.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rand = "0.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
zeroize = "1.9.1"

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["net", "io-util", "test-util", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

# Already in the tree via dirs/tempfile. Handle-based file operations: directory-relative
# NtCreateFile opens, rename/delete/identity by handle, final-path checks, free space.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
